<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" fill="#020617" rx="64"/>
  
  <!-- Grid icon representation -->
  <g transform="translate(106, 106)">
    <!-- Row 1 -->
    <rect x="0" y="0" width="90" height="45" fill="url(#grad)" rx="6"/>
    <rect x="105" y="0" width="90" height="45" fill="url(#grad)" opacity="0.7" rx="6"/>
    <rect x="210" y="0" width="90" height="45" fill="url(#grad)" opacity="0.5" rx="6"/>
    
    <!-- Row 2 -->
    <rect x="0" y="60" width="90" height="45" fill="url(#grad)" opacity="0.7" rx="6"/>
    <rect x="105" y="60" width="90" height="45" fill="url(#grad)" opacity="0.5" rx="6"/>
    <rect x="210" y="60" width="90" height="45" fill="url(#grad)" opacity="0.3" rx="6"/>
    
    <!-- Row 3 -->
    <rect x="0" y="120" width="90" height="45" fill="url(#grad)" opacity="0.5" rx="6"/>
    <rect x="105" y="120" width="90" height="45" fill="url(#grad)" opacity="0.3" rx="6"/>
    <rect x="210" y="120" width="90" height="45" fill="url(#grad)" opacity="0.2" rx="6"/>
    
    <!-- Row 4 -->
    <rect x="0" y="180" width="90" height="45" fill="url(#grad)" opacity="0.3" rx="6"/>
    <rect x="105" y="180" width="90" height="45" fill="url(#grad)" opacity="0.2" rx="6"/>
    <rect x="210" y="180" width="90" height="45" fill="url(#grad)" opacity="0.15" rx="6"/>
    
    <!-- Row 5 -->
    <rect x="0" y="240" width="90" height="45" fill="url(#grad)" opacity="0.2" rx="6"/>
    <rect x="105" y="240" width="90" height="45" fill="url(#grad)" opacity="0.15" rx="6"/>
    <rect x="210" y="240" width="90" height="45" fill="url(#grad)" opacity="0.1" rx="6"/>
  </g>
</svg>
