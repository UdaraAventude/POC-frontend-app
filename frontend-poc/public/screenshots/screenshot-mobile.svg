<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 720">
  <!-- Background -->
  <rect width="540" height="720" fill="#020617"/>
  
  <!-- Toolbar -->
  <rect width="540" height="64" fill="#0f172a"/>
  <text x="20" y="42" font-family="system-ui" font-size="18" font-weight="600" fill="#e2e8f0">DataGrid Pro</text>
  
  <!-- Search bar -->
  <rect x="20" y="84" width="500" height="40" fill="#1e293b" rx="8"/>
  <text x="36" y="110" font-family="system-ui" font-size="14" fill="#64748b">Search...</text>
  
  <!-- Stats -->
  <text x="20" y="154" font-family="system-ui" font-size="12" fill="#94a3b8">50,000 records loaded</text>
  
  <!-- Data Rows -->
  <g id="mobile-rows">
    <!-- Row 1 -->
    <rect x="20" y="176" width="500" height="88" fill="#0c1220" rx="8"/>
    <circle cx="45" cy="210" r="16" fill="#6366f1"/>
    <text x="40" y="216" font-family="system-ui" font-size="11" font-weight="700" fill="white">AB</text>
    <text x="72" y="206" font-family="system-ui" font-size="15" font-weight="500" fill="#e2e8f0">Alice Brown</text>
    <text x="72" y="224" font-family="system-ui" font-size="12" fill="#94a3b8">alice.brown@example.com</text>
    <rect x="440" y="200" width="60" height="20" fill="#10b981" fill-opacity="0.1" rx="10"/>
    <text x="450" y="214" font-family="system-ui" font-size="9" font-weight="600" fill="#10b981">ACTIVE</text>
    
    <!-- Row 2 -->
    <rect x="20" y="276" width="500" height="88" fill="#0a0f1a" rx="8"/>
    <circle cx="45" cy="310" r="16" fill="#8b5cf6"/>
    <text x="40" y="316" font-family="system-ui" font-size="11" font-weight="700" fill="white">CD</text>
    <text x="72" y="306" font-family="system-ui" font-size="15" font-weight="500" fill="#e2e8f0">Charlie Davis</text>
    <text x="72" y="324" font-family="system-ui" font-size="12" fill="#94a3b8">charlie.d@example.com</text>
    <rect x="435" y="300" width="65" height="20" fill="#f59e0b" fill-opacity="0.1" rx="10"/>
    <text x="442" y="314" font-family="system-ui" font-size="9" font-weight="600" fill="#f59e0b">PENDING</text>
    
    <!-- Row 3 -->
    <rect x="20" y="376" width="500" height="88" fill="#0c1220" rx="8"/>
    <circle cx="45" cy="410" r="16" fill="#ec4899"/>
    <text x="40" y="416" font-family="system-ui" font-size="11" font-weight="700" fill="white">EF</text>
    <text x="72" y="406" font-family="system-ui" font-size="15" font-weight="500" fill="#e2e8f0">Emma Foster</text>
    <text x="72" y="424" font-family="system-ui" font-size="12" fill="#94a3b8">emma.foster@example.com</text>
    <rect x="440" y="400" width="60" height="20" fill="#10b981" fill-opacity="0.1" rx="10"/>
    <text x="450" y="414" font-family="system-ui" font-size="9" font-weight="600" fill="#10b981">ACTIVE</text>
    
    <!-- Row 4 -->
    <rect x="20" y="476" width="500" height="88" fill="#0a0f1a" rx="8"/>
    <circle cx="45" cy="510" r="16" fill="#14b8a6"/>
    <text x="40" y="516" font-family="system-ui" font-size="11" font-weight="700" fill="white">GH</text>
    <text x="72" y="506" font-family="system-ui" font-size="15" font-weight="500" fill="#e2e8f0">George Harris</text>
    <text x="72" y="524" font-family="system-ui" font-size="12" fill="#94a3b8">george.h@example.com</text>
    <rect x="433" y="500" width="67" height="20" fill="#64748b" fill-opacity="0.2" rx="10"/>
    <text x="438" y="514" font-family="system-ui" font-size="9" font-weight="600" fill="#94a3b8">INACTIVE</text>
    
    <!-- Row 5 -->
    <rect x="20" y="576" width="500" height="88" fill="#0c1220" rx="8"/>
    <circle cx="45" cy="610" r="16" fill="#f97316"/>
    <text x="41" y="616" font-family="system-ui" font-size="11" font-weight="700" fill="white">IJ</text>
    <text x="72" y="606" font-family="system-ui" font-size="15" font-weight="500" fill="#e2e8f0">Ivy Johnson</text>
    <text x="72" y="624" font-family="system-ui" font-size="12" fill="#94a3b8">ivy.johnson@example.com</text>
    <rect x="440" y="600" width="60" height="20" fill="#10b981" fill-opacity="0.1" rx="10"/>
    <text x="450" y="614" font-family="system-ui" font-size="9" font-weight="600" fill="#10b981">ACTIVE</text>
  </g>
</svg>
